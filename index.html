<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Road Wiki</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0a0a0c; --card:#1a1a20; --text:#f0f0f5; --muted:#a0a0b0; --red:#e63946; --orange:#f77f00; --cyan:#00d4ff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
    .logo { font-family: Orbitron, sans-serif; font-size: 1.8rem; font-weight: 700;
      background: linear-gradient(135deg, var(--red), var(--orange)); -webkit-background-clip: text; color: transparent; }
    h1 { margin: 24px 0 12px; font-size: 2rem; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
    .nav { display: flex; flex-wrap: wrap; gap: 12px; margin: 32px 0; }
    a.btn { display: inline-block; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: 600;
      background: linear-gradient(135deg, var(--red), var(--orange)); color: #fff; }
    a.link { color: var(--cyan); text-decoration: none; padding: 12px 16px; border: 1px solid #2a2a35; border-radius: 10px; }
    .card { background: var(--card); border: 1px solid #2a2a35; border-radius: 12px; padding: 20px; margin-top: 24px; }
    code { background: #121216; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">DR · Dream Road Wiki</div>
    <h1>Всё о Dream Road Online</h1>
    <p>Каталог, гайды, новости. Автодеплой: GitHub Pages / Netlify / Vercel.</p>
    <div class="nav">
      <a class="btn" href="auth.html">Вход / Админ</a>
      <a class="link" href="https://github.com/eazyling1357/Dream-Road-Wiki">GitHub</a>
      <a class="link" href="https://dream-road-wiki.netlify.app">Netlify</a>
    </div>
    <div class="card">
      <p>Локально: <code>cd server &amp;&amp; node index.js</code></p>
      <p>Админ: <code>admin</code> / <code>kassian89</code></p>
    </div>
  </div>
</body>
</html>
